name: REA 072 - one-time Express source-only pilot
on:
  push:
    branches: [nexus/rea-express-pilot-072-20261112]
permissions:
  contents: read
  actions: write
jobs:
  dispatch-express:
    # This is a one-shot fixture; future pushes to this branch cannot
    # repeatedly schedule the test, and repository code is never executed.
    if: github.repository == 'Lucasom825/rea' && github.event.head_commit.message == 'test(rea072): one-time pinned Express pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request bounded public static analysis from existing reviewed REA workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            repos/Lucasom825/rea/actions/workflows/nexus-rea-toolkit.yml/dispatches \
            --input - <<'JSON'
          {
            "ref": "nexus/rea-public-jobs-070-20261111",
            "return_run_details": true,
            "inputs": {
              "target": "public",
              "repository": "expressjs/express",
              "commit": "43fca52d28a422c8be48fd489cbd4f2d6152bab6",
              "directory": "lib"
            }
          }
          JSON
          )"
          echo 'Express.js static-source-only REA dispatch accepted by GitHub.'
          if [[ -n "$response" ]]; then
            printf '%s' "$response" | jq -r 'if .workflow_run_id then "REA_RUN_ID=" + (.workflow_run_id|tostring) else "REA_RUN_ID_NOT_IN_RESPONSE" end'
          else
            echo 'REA_RUN_ID_NOT_IN_RESPONSE'
          fi
