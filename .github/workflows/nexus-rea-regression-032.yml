name: REA NEXUS regression 032 (isolated)
on:
  push:
    branches:
      - nexus/rea-regression-032-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify loader provenance and false-positive regressions
        run: >
          npx vitest run
          src/domain/javascript/javascriptSemanticSharedChildWrites.test.ts
          src/domain/javascript/javascriptStaticAnalysisLoaderInvocations.test.ts
          src/domain/javascript/javascriptStaticAnalysisCapturedRequire.test.ts
          src/domain/javascript/javascriptStaticAnalysisCalleeBoundary.test.ts
          --reporter=verbose
