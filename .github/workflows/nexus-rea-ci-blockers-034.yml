name: REA 034 - focus CI blocker verification
on:
  push:
    branches:
      - nexus/rea-fix-ci-034-20261109
permissions:
  contents: read
jobs:
  verify-ci-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TURBO_TOKEN: "${{ (github.event_name == 'workflow_call' || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && secrets.TURBO_TOKEN || '' }}"
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_CACHE: "${{ (github.event_name == 'workflow_call' || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && 'local:rw,remote:rw' || 'local:rw,remote:r' }}"
      HUSKY: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:cached
      - name: Verify cache and Kuna regressions
        run: npx vitest run tests/boundary/filesystem/ciCachePolicy.test.ts tests/boundary/providers/kuna/kunaVerifier.test.ts --reporter=verbose
      - name: Check modified TypeScript format
        run: npx oxfmt --check tests/boundary/providers/kuna/kunaVerifier.test.ts
