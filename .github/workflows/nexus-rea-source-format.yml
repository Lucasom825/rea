name: REA source official formatting

on:
  push:
    branches:
      - nexus/rea-source-format-028-20261108

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install locked REA formatter
        run: npm ci --no-audit --no-fund
        env:
          HUSKY: "0"
      - name: Format exactly two changed files
        run: npx oxfmt src/domain/javascript/javascriptSemanticRequireOrigin.ts nexus-pilot/toolkit/README.pt-BR.md
      - name: Commit formatted sources only in isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/javascript/javascriptSemanticRequireOrigin.ts nexus-pilot/toolkit/README.pt-BR.md
          if git diff --cached --quiet; then
            echo NO_FORMAT_CHANGES
          else
            git commit -m "style(rea): apply official formatting to candidate sources"
            git push origin HEAD:nexus/rea-source-format-028-20261108
          fi
      - name: Verify official format
        run: npx oxfmt --check src/domain/javascript/javascriptSemanticRequireOrigin.ts nexus-pilot/toolkit/README.pt-BR.md
