name: REA final candidate - format typecheck and lint
on:
  push:
    branches:
      - nexus/rea-qa-final-028-20261108
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install project locked dependencies
        env:
          HUSKY: "0"
        run: npm ci --no-audit --no-fund
      - name: Apply project official formatter to scoped files
        run: npx oxfmt src/domain/javascript/javascriptSemanticRequireOrigin.ts src/domain/javascript/javascriptStaticAnalysisCalleeBoundary.test.ts
      - name: Commit formatting only on disposable branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/javascript/javascriptSemanticRequireOrigin.ts src/domain/javascript/javascriptStaticAnalysisCalleeBoundary.test.ts
          if git diff --cached --quiet; then
            echo 'NO_FORMAT_CHANGES'
          else
            git commit -m 'style(javascript): format confirmed loader-provenance fix'
            git push origin HEAD:nexus/rea-qa-final-028-20261108
          fi
      - name: Check formatted patch
        run: npx oxfmt --check src/domain/javascript/javascriptSemanticRequireOrigin.ts src/domain/javascript/javascriptStaticAnalysisCalleeBoundary.test.ts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check linter
        run: npx oxlint src/domain/javascript/javascriptSemanticRequireOrigin.ts src/domain/javascript/javascriptStaticAnalysisCalleeBoundary.test.ts
